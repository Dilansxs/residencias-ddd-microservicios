services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: residencias_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-residencias}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-residencias_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_port_listener 5672 && rabbitmqctl -q authenticate_user \"$${RABBITMQ_DEFAULT_USER}\" \"$${RABBITMQ_DEFAULT_PASS}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  monitoreo_salud:
    build:
      context: .
      dockerfile: monitoreo_salud/Dockerfile
    container_name: residencias_monitoreo_salud
    environment:
      PYTHONUNBUFFERED: "1"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-residencias}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-residencias_dev}
      TELEMETRIA_DB_DIR: /app/data
    volumes:
      - telemetria_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gestion_alertas:
    build:
      context: .
      dockerfile: gestion_alertas/Dockerfile
    container_name: residencias_gestion_alertas
    environment:
      PYTHONUNBUFFERED: "1"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-residencias}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-residencias_dev}
      ALERTAS_DB_PATH: /app/data/alertas_plataforma.db
    volumes:
      - alertas_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  telemetria_data:
  alertas_data: